syntax = "proto3";

package biblioteca;

service LibrosService {
  rpc ObtenerLibro (LibroRequest) returns (LibroResponse);
  rpc VerificarDisponibilidad (LibroRequest) returns (DisponibilidadResponse);
}

message LibroRequest {
  string id = 1;
}

message LibroResponse {
  string id = 1;
  string titulo = 2;
  string autor = 3;
  string isbn = 4;
  bool disponible = 5;
}

message DisponibilidadResponse {
  string id = 1;
  bool disponible = 2;
}